 Eşya", "I left my bag on the bus.", "I left my bag on the bus.", "Past simple: leave → left."], ["Okul Projesi", "We have already finished our project.", "We have already finished our project.", "Present perfect with already."], ["İş Görüşmesi", "I am good at solving problems.", "I am good at solving problems.", "Good at + -ing."], ["Sinema Planı", "If it rains, we will watch a movie.", "If it rains, we will watch a movie.", "First conditional: if + present, will."], ["Restoranda Sorun", "Excuse me, I ordered vegetable soup.", "Excuse me, I ordered vegetable soup.", "Polite complaints in the past."], ["Telefon Görüşmesi", "Could you speak a little more slowly?", "Could you speak a little more slowly?", "Polite requests with could."], ["Seyahat Günlüğü", "I have never visited London before.", "I have never visited London before.", "Present perfect with never."], ["Topluluk Etkinliği", "If I had more time, I would volunteer.", "If I had more time, I would volunteer.", "Second conditional: if + past, would."]], "scene": [["🌙🏡", "The Little Lantern", "One quiet evening, Gigi found a tiny lantern beside Miss Hootie’s classroom. It was not an ordinary lantern. A little star was sleeping inside it. Gigi whispered, Hello, little star. The star blinked once, then twice. I am lost, it said softly. I cannot find my way home. Gigi held the lantern carefully with both hands. Do not worry, said Gigi. We will help you. Miss Hootie smiled and opened a big, blue map. First, she said, we need to listen, look, and be kind."], ["🌳🦉", "The Whispering Forest", "Gigi and Miss Hootie walked into the whispering forest. The trees were tall and green. The leaves danced in the cool night air. A friendly rabbit hopped out from behind a mushroom. Hop, hop, hop! Hello, rabbit, said Gigi. Have you seen the way to the stars? The rabbit twitched its nose. Follow the silver flowers, it said. But be gentle. The flowers are sleeping. Gigi tiptoed very slowly. One little step. Two little steps. Three little steps. The star inside the lantern glowed a little brighter. Thank you, rabbit, whispered Gigi."], ["🌼🐝", "The Flower Meadow", "Soon they reached a meadow filled with flowers. Red flowers, yellow flowers, blue flowers, and purple flowers. A sleepy bee rested on a yellow flower. Buzz, buzz, buzz, went the bee. Gigi wanted to run, but Miss Hootie held up a wing. Wait, Gigi. Let us ask politely. Excuse me, little bee, said Gigi. Which flower can show us the path? The bee pointed to a bright blue flower. Look under the blue petals, it said. There was a small golden key. Gigi picked it up and said, Thank you very much."], ["🌉🐢", "The Moonlight Bridge", "At the edge of the meadow stood a little bridge. The bridge crossed a river that shone like silver. A turtle sat beside it, looking worried. I cannot find my shell decoration, said the turtle. It is a little green leaf. Gigi looked near the water. Miss Hootie looked under a stone. Then Gigi spotted something floating beside a lily. A green leaf! Here it is, said Gigi. The turtle was so happy that it began to dance. Step, step, wiggle, wiggle! The turtle let them cross the bridge. The lantern shone brighter than before."], ["☁️🦊", "The Cloudy Hill", "Beyond the bridge was a soft hill covered in clouds. A little fox sat at the top, staring at the sky. The fox was afraid of the dark. Gigi sat beside the fox and listened. Sometimes I feel afraid too, said Gigi. But I can take a deep breath. In we breathe. Out we breathe. Miss Hootie counted slowly. One, two, three. The fox tried again. The fox smiled. I feel better now, it said. A cloud moved away, and a beautiful moon appeared. The little star inside the lantern danced with joy."], ["🧩🌈", "The Rainbow Gate", "They arrived at a rainbow gate. It had three glowing shapes: a circle, a square, and a triangle. A tiny voice said, To open the gate, say three kind words. Gigi thought for a moment. Please, said Gigi. Thank you, said Miss Hootie. And together they said, You are welcome! The shapes began to sparkle. The circle turned yellow. The square turned blue. The triangle turned red. Slowly, the rainbow gate opened. Behind it was a stairway made of moonbeams. Up, up, up, they climbed, one careful step at a time."], ["⭐🪜", "The Stairway of Stars", "The stairway led to a quiet sky garden. There were little stars everywhere. Some stars were big. Some stars were small. Some stars twinkled quickly, and some twinkled slowly. But the little star in Gigi’s lantern still looked sad. I cannot see my family, it whispered. Gigi held the lantern high and called, Hello! Is anybody there? For a moment, nothing happened. Then a bright star answered from far away. We are here! We have been looking for you! The little star jumped with excitement. My family! My family! it cried."], ["🌟💜", "A Kind Goodnight", "Gigi opened the lantern door. The little star floated gently into the night sky. It hugged the big bright star and all the tiny stars around it. Thank you, Gigi. Thank you, Miss Hootie, it called. Gigi waved both hands. Goodbye, little star. Sleep well! A warm light filled the sky, and the moon smiled down at the forest. On their way home, Miss Hootie asked, What did we learn tonight? Gigi thought carefully. We learned to listen, to help, and to be kind. Miss Hootie nodded. That is a wonderful lesson. Goodnight, Gigi. Goodnight, little star. And goodnight to you."]]};

function home(){let count=Object.keys(done).filter(k=>k.startsWith(age+'-')&&done[k]).length;shell(`<section class="card"><h1>✨ ${lang==='tr'?'Gigi ile İngilizce öğren!':'Learn English with Gigi!'}</h1><p>🦉 Miss Hootie + 🐒 Gigi</p><label>${t('age')} <select id="age"><option value="4-6">4–6</option><option value="6-10">6–10</option><option value="10-13">10–13</option></select></label> &nbsp; <label>${t('language')} <select id="lang"><option value="tr">Türkçe</option><option value="en">English</option><option value="he">עברית</option></select></label><p class="muted">${age==='4-6'?'🎧 Resim + ses · Okuma gerekmiyor':age==='6-10'?'🧩 Cümle kurma ve yapı':'💬 Günlük diyalog ve gramer'}</p><div class="bar"><div style="width:${count/15*100}%"></div></div><p class="count">${count}/15 macera</p><div class="row"><button class="primary" id="adventures">🎮 ${t('start')}</button><button id="books">📚 ${t('books')}</button></div>${age!=='4-6'?`<p><button id="test">📝 ${t('test')}</button></p>`:''}</section><section class="card"><h2>🎯 Öğrenme yolu</h2><p>${age==='4-6'?'15 sesli görsel macera → kelimeler → kısa sözlü cümleler':age==='6-10'?'15 ayrı macera → kelime sıralama → cümle yapısı':'15 ayrı gerçek yaşam macerası → diyaloglar → gramer'}</p></section>`);$('#age').value=age;$('#lang').value=lang;$('#age').onchange=e=>{age=e.target.value;localStorage.setItem('gigi_age_v16',age);render()};$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('gigi_lang_v16',lang);render()};$('#adventures').onclick=()=>go('list');$('#books').onclick=()=>go('book');if($('#test'))$('#test').onclick=()=>{quizStep=0;quizScore=0;go('test')}}

const story=DATA.scene,fullStory=story.map(x=>x[2]).join(' ');let storyDuration=Math.max(305,fullStory.split(/\s+/).length/125*60),bookElapsed=0,bookTick=0;
function stopBook(){bookToken++;bookRunning=false;bookPaused=false;clearInterval(bookTimer);try{speechSynthesis.cancel()}catch(e){}}

function drawBook(){let p=story[bookPage];shell(`<section class="card"><h1>📚 Gigi's Little Lantern</h1><p class="muted">🌙 4–6 yaş için masalımsı hikâye · yaklaşık ${Math.ceil(storyDuration/60)} dakika · İngilizce anlatım</p><div class="book card"><h2>${esc(p[1])}</h2><div class="page-emoji">${p[0]}</div><p>${esc(p[2])}</p></div><div class="bar"><div style="width:${Math.min(100,bookElapsed/storyDuration*100)}%"></div></div><p class="muted">Sayfa ${bookPage+1}/${story.length} · ${Math.floor(bookElapsed/60)}:${String(Math.floor(bookElapsed%60)).padStart(2,'0')} / ~${Math.ceil(storyDuration/60)} dk</p><div class="row"><button class="primary" id="bookPlay">${bookRunning&&!bookPaused?'⏸ '+t('pause'):'▶️ '+t('play')}</button><button id="bookRestart">↺ Baştan</button></div><p class="muted">Bir kez Play: anlatım sürer ve sayfalar otomatik değişir. Ses, cihazdaki İngilizce ses kalitesine bağlıdır.</p></section>`);$('#bookPlay').onclick=()=>bookRunning?togglePause():startBook();$('#bookRestart').onclick=()=>{stopBook();bookElapsed=0;bookPage=0;startBook()}}
function startBook(){stopBook();bookRunning=true;bookPaused=false;bookPage=0;bookElapsed=0;let token=bookToken;function narratePage(){if(token!==bookToken)return;let u=speak(story[bookPage][2],.73);if(!u){stopBook();drawBook();return}u.onend=()=>{if(token!==bookToken)return;if(bookPage>=story.length-1){stopBook();bookElapsed=storyDuration;drawBook();return}bookPage++;drawBook();narratePage()};u.onerror=()=>{if(token===bookToken){stopBook();drawBook()}}}bookTick=Date.now();bookTimer=setInterval(()=>{if(token!==bookToken||bookPaused)return;let now=Date.now();bookElapsed+=(now-bookTick)/1000;bookTick=now;let progress=$('.bar>div');if(progress)progress.style.width=Math.min(99,bookElapsed/storyDuration*100)+'%'},700);drawBook();narratePage()}

function togglePause(){if(!bookRunning){startBook();return}bookPaused=!bookPaused;try{bookPaused?speechSynthesis.pause():speechSynthesis.resume()}catch(e){}bookTick=Date.now();drawBook()}
